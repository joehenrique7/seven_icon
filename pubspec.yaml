name: seven_icon
description: "Seven Icon: pacote de ícones do AtletaDoVolei baseado no Iconsax, exportados como icon font."
version: 0.6.0
homepage:

environment:
  sdk: ^3.5.0
  flutter: ">=3.18.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^5.0.0

flutter:
  # A icon font do Iconsax é registrada aqui.
  # O family "SevenIcon" casa com a classe `SevenIcons` (não precisa bater com o
  # nome interno da fonte; o Flutter usa este nome só para referenciar o asset).
  fonts:
    - family: SevenIcon
      fonts:
        - asset: assets/fonts/iconsax.ttf
